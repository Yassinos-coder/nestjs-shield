<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="NestJS Shield">
    <meta name="twitter:card" content="summary">
    <title>{{ page.title | escape }}</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "NestJS Shield",
            "url": "{{ site.url }}{{ site.baseurl }}/"
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "nestjs-shield",
            "description": "{{ site.description | escape }}",
            "codeRepository": "https://github.com/Yassinos-coder/nestjs-shield",
            "programmingLanguage": "TypeScript",
            "runtimePlatform": "Node.js",
            "license": "https://opensource.org/license/mit/",
            "url": "{{ site.url }}{{ site.baseurl }}/"
          }
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to documentation</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="NestJS Shield home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>nestjs-shield</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#install">Install</a>
        <a href="{{ '/' | relative_url }}#configuration">Configuration</a>
        <a href="{{ '/' | relative_url }}#admin-dashboard">Dashboard</a>
        <a href="{{ '/' | relative_url }}#contributing">Contributing</a>
        <a class="nav-github" href="https://github.com/Yassinos-coder/nestjs-shield">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main-content" class="content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>Open source under the MIT License.</span>
      <span><a href="https://github.com/Yassinos-coder/nestjs-shield">View source</a> · <a href="https://www.npmjs.com/package/nestjs-shield">npm package</a></span>
    </footer>
  </body>
</html>
