name: Publish package

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - package.json
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: Which registry to publish to
        required: true
        default: both
        type: choice
        options:
          - both
          - npm
          - github

jobs:
  publish-npm:
    name: Publish to npm (public)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'npm' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          always-auth: true

      - name: Check whether this version needs publishing
        id: npm-version
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            previous_version="$(git show "${EVENT_BEFORE}:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)"
            if [ "$version" = "$previous_version" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if npm view "nestjs-shield@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.npm-version.outputs.publish == 'true'
        run: npm ci

      - name: Test and build
        if: steps.npm-version.outputs.publish == 'true'
        run: npm test

      - name: Publish
        if: steps.npm-version.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Publish to GitHub Packages (scoped)
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'github') && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@yassinos-coder'
          always-auth: true

      - name: Install
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Rewrite name for GitHub Packages
        run: npm pkg set name=@yassinos-coder/nestjs-shield

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
